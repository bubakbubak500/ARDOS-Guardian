name: Linux 1.1.24 build

on:
  push:
    branches: ["linux/1.1.24"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      GUARDIAN_STATE_DIR: /tmp/guardian-build-state
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libpng-dev libjpeg-dev libportaudio2 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libhamlib-utils xvfb
      - name: Build pinned JPEG XL tools on Linux
        run: |
          bash tools/build_jpegxl_linux.sh
          echo "$GITHUB_WORKSPACE/codecs/vendor/jpegxl/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build native ARDOP and test Linux paths
        run: |
          python tools/build_ardop.py
          mkdir -p output
          python -m pytest tests/test_linux*.py tests/test_ardop.py tests/test_ardop_audio.py tests/test_sc_port_core.py tests/test_sc_port_payload.py tests/test_sc_port_session.py tests/test_sc_adaptive_capacity.py tests/test_afsk.py tests/test_mfsk.py tests/test_hamlib.py tests/test_radio_dummy_linux.py -rA | tee output/linux-tests.txt
      - name: Build Linux application and archive
        run: bash build_linux.sh
      - name: Verify the packaged application
        run: |
          dist/Guardian/Guardian --qt-self-test --qt-self-test-report output/linux-frozen-qt.txt
          dist/Guardian/Guardian --compression-self-test --compression-self-test-report output/linux-frozen-compression.txt
          dist/Guardian/Guardian --ardop-self-test --ardop-self-test-report output/linux-frozen-ardop.txt
          dist/Guardian/Guardian --ardos-cz-self-test --ardos-cz-self-test-report output/linux-frozen-ardos-cz.txt
          python tools/verify_linux_bundle.py
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-1.1.24-linux-verification
          path: output/
      - name: Save Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-1.1.24-linux-x64
          path: |
            release/Guardian-1.1.24-linux-x64.tar.gz
            release/Guardian-1.1.24-linux-source.zip
            release/release-manifest-linux-x64.json
            release/SHA256SUMS-linux-x64.txt
