[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ardos-guardian"
dynamic = ["version"]
description = "Store-and-forward ARDOS messaging and routing for VARA FM/HF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "PySide6-Essentials>=6.7,<7",
  "pyserial>=3.5,<4",
  "sounddevice>=0.4.6,<1",
  "winrt-Windows.Devices.Geolocation>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyinstaller>=6.8,<7",
]

[project.gui-scripts]
guardian = "guardian.app:main"

[project.urls]
Homepage = "https://github.com/bubakbubak500/ARDOS-Guardian"
Documentation = "https://github.com/bubakbubak500/ARDOS-Guardian#readme"
Releases = "https://github.com/bubakbubak500/ARDOS-Guardian/releases"
Issues = "https://github.com/bubakbubak500/ARDOS-Guardian/issues"

[tool.setuptools.dynamic]
version = {attr = "guardian._version.__version__"}

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
